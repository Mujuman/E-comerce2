<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Muju Store</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h1 class="logo">Muju Store</h1>

    <ul class="nav-links">
      <li><a href="#hero-content">Home</a></li>
      <li><a href="#prod">Products</a></li>
      <li><a href="product-form.html">Add Product</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content" id="hero-content">
      <h2>Modern Shopping Experience</h2>
      <p>
        Discover amazing products with beautiful design
      </p>

      <button class="shop-btn">
        <a href="#prod" class="shop-now">Shop Now</a>
      </button>
    </div>
  </section>

  <!-- Loading
  <div class="loader" id="loader"></div> -->

  <!-- Products -->
  <section class="products-section">
    <h2 class="section-title" id="prod">
      Our Products
    </h2>

    <div class="products" id="products"></div>
  </section>

  <script src="javascript-api.js"></script>
</body>
</html>
