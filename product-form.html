<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Product | Muju Store</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <h1 class="logo">Muju Store</h1>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#prod">Products</a></li>
      <li><a href="product-form.html" class="active-link">Add Product</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="cart.html">Cart <span class="cart-count">0</span></a></li>
    </ul>
  </nav>

  <section class="form-page">
    <div class="form-card">
      <div class="form-intro">
        <span class="badge">New Product</span>
        <h2>Add a beautiful product to your store</h2>
        <p>Fill in the details below to create a new product listing with a polished design and seamless experience.</p>
      </div>

      <form class="product-form" action="#" method="post">
        <div class="input-group">
          <label for="productName">Product Name</label>
          <input type="text" id="productName" name="productName" placeholder="Enter product name" required>
        </div>

        <div class="input-group">
          <label for="productPrice">Price</label>
          <input type="number" id="productPrice" name="productPrice" placeholder="99.99" step="0.01" required>
        </div>

        <div class="input-group">
          <label for="productCategory">Category</label>
          <select id="productCategory" name="productCategory" required>
            <option value="">Select a category</option>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="home">Home</option>
            <option value="beauty">Beauty</option>
            <option value="sports">Sports</option>
          </select>
        </div>

        <div class="input-group">
          <label for="productImage">Image URL</label>
          <input type="url" id="productImage" name="productImage" placeholder="https://example.com/image.jpg" required>
        </div>

        <div class="input-group full-width">
          <label for="productDescription">Description</label>
          <textarea id="productDescription" name="productDescription" rows="5" placeholder="Describe your product" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Create Product</button>
      </form>
    </div>
  </section>
  <script src="javascript-api.js"></script>
</body>
</html>
